version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: netflow
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://admin:password@db:5432/netflow
    depends_on:
      - db
      - redis

volumes:
  postgres_data: